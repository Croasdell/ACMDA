name: PHP CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite

      - name: Lint PHP files
        run: find . -path './public_html/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Smoke test message workflow
        run: |
          php -r '
            require "public_html/acmda.php";
            $db = initDb(":memory:");
            saveBusinessData($db, defaultServices());
            $id = receiveMessage($db, "ci", "Need tiling");
            $row = $db->query("SELECT status, draft FROM wa_messages WHERE id = " . (int) $id)->fetch(PDO::FETCH_ASSOC);
            if ($row["status"] !== "pending" || !str_contains($row["draft"], "tiling")) {
                exit(1);
            }
          '
